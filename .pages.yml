media:
  - name: images
    label: Zdjęcia
    input: media/images
    output: /media/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: strona_glowna
    label: PL — Strona główna
    type: file
    path: content/strona-glowna.json
    format: json
    operations:
      delete: false
    fields:
      - name: lede
        label: Wprowadzenie
        type: text
        required: true
      - name: sundayMassSeason
        label: Najbliższa Msza niedzielna — miejsce lub odwołanie
        description: Wybierz kościół, kaplicę albo „Msza odwołana”. Przy odwołaniu wypełnij datę konkretnej niedzieli i przyczynę. Po tej dacie wyróżniony blok automatycznie wraca do zwykłego miejsca wskazanego poniżej.
        type: select
        required: true
        options:
          values:
            - name: summer
              label: Lato — kościół Sainte-Ségolène
            - name: winter
              label: Zima — kaplica Sainte-Croix
            - name: cancelled
              label: Msza odwołana — podaj datę i przyczynę
      - name: sundayMassCancelledDate
        label: Data odwołanej niedzieli
        description: Uzupełnij TYLKO przy opcji „Msza odwołana”. Odwołanie dotyczy wyłącznie tej niedzieli, nie każdej kolejnej. Data powinna wypadać w niedzielę. Bez prawidłowej daty strona pokaże informację o konieczności potwierdzenia Mszy zamiast wskazywać trasę.
        type: date
        required: false
        options:
          time: false
          format: dd/MM/yyyy
      - name: sundayMassCancellationReasonPl
        label: Powód odwołania — po polsku
        description: Wyświetlany tylko przy odwołanej niedzieli. Np. „Z powodu pielgrzymki parafialnej Msza święta nie odbędzie się”.
        type: text
        required: false
      - name: sundayMassCancellationReasonFr
        label: Motif de l’annulation — po francusku
        description: Powód dla francuskiej wersji. Np. « La messe est annulée en raison du pèlerinage paroissial ». Jeśli pozostawisz puste, pojawi się informacja o niepodanej przyczynie.
        type: text
        required: false
      - name: sundayMassReturnSeason
        label: Zwykłe miejsce Mszy po odwołaniu
        description: Gdzie normalnie odbywa się Msza w następnych niedzielach (i przed datą odwołania). Gdy wybrano „Msza odwołana”, po wskazanej dacie to miejsce pokaże się automatycznie.
        type: select
        required: true
        options:
          values:
            - name: summer
              label: Kościół Sainte-Ségolène
            - name: winter
              label: Kaplica Sainte-Croix
      - name: massLabel
        label: Etykieta Mszy
        type: string
        required: true
      - name: massValue
        label: Godzina Mszy
        type: string
        required: true
      - name: addressLabel
        label: Etykieta adresu
        type: string
        required: true
      - name: addressValue
        label: Adres
        type: string
        required: true
      - name: contactLabel
        label: Etykieta kontaktu
        type: string
        required: true
      - name: contactValue
        label: Kontakt
        type: string
        required: true
      - name: paragraph1
        label: Pierwszy akapit
        type: text
        required: true
      - name: callout
        label: Wyróżniony tekst
        type: text
        required: true
      - name: paragraph2
        label: Ostatni akapit
        type: rich-text
        required: true
        options:
          format: html
          switcher: false
          media: false

  - name: msze
    label: PL — Msze i nabożeństwa
    type: file
    path: content/msze.json
    format: json
    operations:
      delete: false
    fields:
      - name: lede
        label: Wprowadzenie
        type: text
        required: true
      - name: items
        label: Harmonogram
        description: Edytuj, dodawaj i przeciągaj bloki, aby zmienić ich kolejność na stronie.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: icon
            label: Ikona
            type: select
            required: true
            options:
              values:
                - name: clock
                  label: Zegar
                - name: sun
                  label: Nabożeństwo / słońce
                - name: heart
                  label: Spowiedź / serce
                - name: church
                  label: Kościół
          - name: rows
            label: Wiersze informacji
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}."
            fields:
              - name: label
                label: Etykieta
                type: string
                description: Opcjonalnie, np. Godzina albo Zima.
              - name: text
                label: Treść
                type: text
                required: true
          - name: visible
            label: Widoczne na stronie
            type: boolean
            default: true
          - name: locations
            label: Kościoły / miejsca Mszy
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{address}"
            fields:
              - name: name
                label: Nazwa miejsca / kościoła
                type: string
                description: Np. Kościół Sainte-Ségolène, Kaplica Sainte-Croix.
                required: true
              - name: address
                label: Adres
                type: string
                required: true
              - name: website
                label: Strona internetowa
                type: string
                required: false
              - name: verified
                label: Dane zweryfikowane
                type: boolean
                default: false
      - name: note
        label: Informacja pod harmonogramem
        type: text
        required: false

  - name: aktualnosci
    label: PL — Ogłoszenia Duszpasterskie
    type: file
    path: content/aktualnosci.json
    format: json
    operations:
      delete: false
    fields:
      - name: lede
        label: Wprowadzenie
        type: text
        required: true
      - name: items
        label: Ogłoszenia
        description: Aby dodać nowe ogłoszenie, kliknij przycisk „Add an item” poniżej.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: date
            label: Data
            type: date
            required: true
            description: Nowsza data oznacza wyższą pozycję na stronie.
            options:
              time: false
              format: dd/MM/yyyy
          - name: body
            label: Treść
            description: "Enter = nowy akapit. Shift+Enter = nowa linia. Zaznacz tekst, aby wyświetlić pasek formatowania: nagłówki, pogrubienie, kursywa, podkreślenie, listy punktowane i numerowane, cytat oraz link."
            type: rich-text
            required: true
            options:
              format: html
              switcher: false
              media: false
          - name: alignment
            label: Wyrównanie treści
            type: select
            description: Dotyczy całej treści wpisu na stronie.
            options:
              values:
                - name: left
                  label: Do lewej
                - name: center
                  label: Wyśrodkowane
                - name: right
                  label: Do prawej
                - name: justify
                  label: Wyjustowane
          - name: published
            label: Opublikowane
            type: boolean
            default: false

  - name: wydarzenia
    label: PL — Wydarzenia
    type: file
    path: content/wydarzenia.json
    format: json
    operations:
      delete: false
    fields:
      - name: communityItems
        label: Stałe elementy życia wspólnoty
        description: Edytuj, dodawaj i przeciągaj elementy, aby zmienić ich kolejność na stronie.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: body
            label: Opis
            type: text
            required: true
          - name: expandable
            label: Klikalne – otwórz szczegóły
            description: Włącza okienko po kliknięciu, gdy opis szczegółowy jest uzupełniony.
            type: boolean
            default: false
          - name: details
            label: Pełny opis po kliknięciu
            description: Opcjonalny tekst wyświetlany w okienku po kliknięciu.
            type: rich-text
            required: false
            options:
              format: html
              switcher: false
              media: false
          - name: icon
            label: Ikona
            type: select
            required: true
            options:
              values:
                - name: book
                  label: Katecheza / książka
                - name: coffee
                  label: Kawa / spotkanie
                - name: star
                  label: Uroczystość / gwiazda
                - name: calendar
                  label: Kalendarz / termin
                - name: cross
                  label: Krzyż
                - name: people
                  label: Wspólnota
                - name: church
                  label: Kościół
          - name: visible
            label: Widoczne na stronie
            type: boolean
            default: true

      - name: items
        label: Wydarzenia
        description: Dodaj wydarzenie, uzupełnij dane i włącz „Opublikowane”, gdy ma pojawić się na stronie.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {date}"
        fields:
          - name: title
            label: Tytuł
            type: string
            required: true
          - name: date
            label: Data
            type: date
            required: true
            options:
              time: false
              format: dd/MM/yyyy
          - name: time
            label: Godzina
            type: string
            description: Opcjonalnie, np. 15:00.
          - name: place
            label: Miejsce
            type: string
            description: Opcjonalnie.
          - name: body
            label: Opis
            description: "Enter = nowy akapit. Shift+Enter = nowa linia. Zaznacz tekst, aby wyświetlić pasek formatowania: nagłówki, pogrubienie, kursywa, podkreślenie, listy punktowane i numerowane, cytat oraz link. Zdjęcia można wstawiać bezpośrednio między akapitami za pomocą opcji obrazu w edytorze. Oddzielne pole Zdjęcie pozostaje zdjęciem głównym wydarzenia."
            type: rich-text
            required: true
            options:
              format: html
              switcher: false
              media: images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: alignment
            label: Wyrównanie treści
            type: select
            description: Dotyczy całej treści wydarzenia na stronie.
            options:
              values:
                - name: left
                  label: Do lewej
                - name: center
                  label: Wyśrodkowane
                - name: right
                  label: Do prawej
                - name: justify
                  label: Wyjustowane
          - name: image
            label: Zdjęcie
            type: image
            required: false
            options:
              media: images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: published
            label: Opublikowane
            type: boolean
            default: false

